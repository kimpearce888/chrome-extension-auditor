name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Build extension + local-only lint
        run: |
          npm run build
          npm run lint

      - name: Assemble Windows distribution ZIP
        run: npm run package

      - name: Verify artifacts
        run: |
          test -f package/Local-Chrome-Extension-Auditor/native/scanner.exe
          test -f package/Local-Chrome-Extension-Auditor/extension/manifest.json
          test -f package/Local-Chrome-Extension-Auditor/Install.bat
          echo "Release artifacts verified"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            package/Local-Chrome-Extension-Auditor-Windows.zip
